<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Submit a new email — Helpdesk Triage</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
           margin: 0; background: #f5f6f8; color: #1f2328; }
    header { background: #1f4e78; color: #fff; padding: 16px 32px; }
    header h1 { margin: 0; font-size: 20px; font-weight: 600; }
    main { padding: 24px 32px; max-width: 780px; }
    label { display: block; margin: 16px 0 8px; font-weight: 500; }
    textarea { width: 100%; min-height: 280px; padding: 12px;
               font-family: 'Courier New', monospace; font-size: 13px;
               border: 1px solid #d0d7de; border-radius: 6px; background: #fff; }
    button { background: #1f4e78; color: #fff; border: 0; border-radius: 6px;
             padding: 8px 16px; font-size: 14px; cursor: pointer;
             margin-top: 16px; }
    button:hover { background: #2c6494; }
    a.back { color: #0969da; text-decoration: none; font-size: 13px; }
    .hint { color: #57606a; font-size: 13px; margin-top: 4px; }
  </style>
</head>
<body>
<header>
  <h1>Helpdesk Triage</h1>
</header>
<main>
  <p><a class="back" href="{{ url_for('index') }}">← Back to ticket list</a></p>
  <h2>Submit a new email</h2>
  <p class="hint">Paste a raw email-style message. The triage engine will
     parse the headers, classify the category, and assign a priority.</p>

  <form method="post">
    <label for="email">Email message</label>
    <textarea id="email" name="email" placeholder="From: someone@example.com
Subject: My laptop won't turn on

Hi team, my laptop's screen stays black. I have a client meeting
this afternoon — could you take a look ASAP?
"></textarea>
    <button type="submit">Submit</button>
  </form>
</main>
</body>
</html>
